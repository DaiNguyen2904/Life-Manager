plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.example.lifemanager'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.example.lifemanager'
        // minSdk 26 (Android 8.0) để dùng trực tiếp Java Time API (java.time) và Adaptive Icon
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = '1.0.0'

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
}

dependencies {
    // Giao diện: AppCompat + Material Design 3 + ConstraintLayout + RecyclerView
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    // MVVM: ViewModel + LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'

    // Room Database (SQLite) - dùng annotationProcessor cho Java
    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'

    // Biểu đồ
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Kiểm thử
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
